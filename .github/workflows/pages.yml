# Publica la app (la carpeta Agora/) en GitHub Pages cada vez que cambia main.
# Requiere activar una vez: Settings → Pages → Source: «GitHub Actions».
name: Publicar en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Dejar solo lo que necesita la app
        run: rm -rf Agora/pruebas Agora/herramientas Agora/package.json Agora/CLAUDE.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Agora
      - id: deploy
        uses: actions/deploy-pages@v4
